name: Editorial validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  article-metadata:
    name: Validate article metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate articles
        run: npm run validate:articles

      - name: Validate verification records
        run: npm run validate:verification

      - name: Validate claim evidence traceability
        run: npm run validate:claims

      - name: Validate source independence and contradictions
        run: npm run validate:independence

      - name: Validate provenance lineage
        run: npm run validate:lineage

      - name: Validate audit logs
        run: npm run audit:validate

      - name: Validate failure and recovery records
        run: npm run recovery:validate

      - name: Validate legacy certification records
        run: npm run legacy:certify:validate

      - name: Check legacy gate readiness
        run: npm run legacy:gate:readiness

      - name: Run news consolidation regression audit
        run: npm run test:news:consolidation

      - name: Run news event relation regression audit
        run: npm run test:news:relations

      - name: Run editorial E2E acceptance tests
        run: npm run test:e2e:editorial

      - name: Enforce changed-article editorial guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          files=$(git diff --name-only "$RANGE" -- 'content/articles/*.md' 'content/articles/**/*.md' || true)
          if [[ -z "$files" ]]; then
            echo "No article files changed; editorial guard not required for this commit."
            exit 0
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Guarding $file"
            node scripts/news-editorial-guard.mjs --article "$file"
          done <<< "$files"

      - name: Enforce Publication Gate
        run: npm run check:publication

# Publication Gate is globally enforced.
# A published article must have a valid publication-gate record with verified
# publication claims, supporting publication sources, resolved material contradictions,
# and explicit human editorial approval. Legacy articles must first be CERTIFIED or WITHDRAWN.
# The editorial guard additionally blocks new duplicate-event candidates at intake and
# enforces section authorship, visible sources and the original-redaction declaration
# for new editorial material.
